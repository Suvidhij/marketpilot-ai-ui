name: Windows startup script syntax
on:
  push:
    paths: ['Start-UI.ps1', '.github/workflows/windows-startup.yml']
  pull_request:
    paths: ['Start-UI.ps1', '.github/workflows/windows-startup.yml']
permissions:
  contents: read
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Start-UI.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Start-UI.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
